name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # release tag
  id-token: write # npm provenance (OIDC)

jobs:
  publish:
    name: Publish release from main
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Resolve version and check npm
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "adopted-style-sheets@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already published on npm – skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION is not published yet – proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine dist-tag
        id: tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG=$(node -e "
            const [core, prerelease] = process.argv[1].split('+')[0].split(/-(.+)/);
            console.log(prerelease ? 'next' : 'latest');
          " "$VERSION")
          echo "Version $VERSION → dist-tag $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.version.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: steps.version.outputs.skip == 'false'
        run: npm test

      - name: Publish
        if: steps.version.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # optional; OIDC (trusted publishing) takes precedence
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Publishing $VERSION with dist-tag $TAG"
          npm publish --provenance --tag "$TAG"

      - name: Create release tag
        if: steps.version.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
